name: Build, Push & Deploy

on:
  push:
    branches:
      - release

env:
  IMAGE_NAME: ghcr.io/naveenyadav9515/onespaceservices

jobs:
  deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Docker Buildx for efficient builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Automated Version Bump
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Automatic Version Bump
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Get the latest version from git tags (source of truth)
          LATEST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          CURRENT_VERSION="${LATEST_TAG#v}"
          echo "Current version from tags: $CURRENT_VERSION"
          
          # Sync package.json to match the latest tag
          npm version "$CURRENT_VERSION" --no-git-tag-version --allow-same-version
          
          # Determine version bump based on Conventional Commits
          if echo "$COMMIT_MSG" | grep -qE "^[a-zA-Z]+!:" || echo "$COMMIT_MSG" | grep -q "BREAKING CHANGE"; then
            echo "Major bump requested"
            npm version major --no-git-tag-version
          elif echo "$COMMIT_MSG" | grep -qE "^feat:"; then
            echo "Minor bump requested"
            npm version minor --no-git-tag-version
          else
            echo "Defaulting to patch bump"
            npm version patch --no-git-tag-version
          fi
          
          # Create and push the new tag
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New version: $NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      # 4. Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: naveenyadav9515
          password: ${{ secrets.GHCR_PAT }}

      # 5. Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:release
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Trigger fresh deployment on Render
      - name: Deploy to Render
        run: curl -s "https://api.render.com/deploy/srv-d97kmc7avr4c73d3ki2g?key=pVLz4jhiF3M"
