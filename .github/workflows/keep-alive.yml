name: ☀️ Wake Up Render

# ─────────────────────────────────────────────────────────────────────
# Pings both the backend and frontend Render services every morning at
# 7:00 AM IST (01:30 UTC) so they are warm and ready before users arrive.
#
# Once the backend wakes, its internal keep-alive (utils/keep-alive.js)
# takes over and pings /api/health every 10 minutes until 11 PM IST.
# After 11 PM IST the keep-alive stops, Render sleeps the server, and
# this cron wakes it again the next morning.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 01:30 UTC = 07:00 IST — every day
    - cron: '30 1 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  wake:
    name: Wake Render Services
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          echo "⏰ Waking backend at $(date -u '+%H:%M UTC') (07:00 IST)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://onespace-services.onrender.com/api/health || echo "000")
          echo "Backend responded: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "⚠️ Backend did not respond within 120s (cold start may be slow)"
          fi

      - name: Ping Frontend
        run: |
          echo "⏰ Waking frontend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://one-space.onrender.com || echo "000")
          echo "Frontend responded: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "⚠️ Frontend did not respond within 120s (cold start may be slow)"
          fi
